<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: SKU Generator</title>

    <!-- Python Links -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>


        <!-- Bootstrap 5 Script -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

            <div class="container bg-white p-4 rounded shadow">
                <h1 class="mb-4 text-danger"><b>Sky Dine: SKU Confirmation Page</h1>

                    <!-- credentials -->
                <div class="mb-3">
                    <label class="form-label"><b>Confirmation Name:</label>
                    <input type="text" id="name" class="form-control text-center" placeholder="John Doe">
                </div>

                <!-- order  -->
                <p class="fw-bold">Select Your Order</p>
                    <div class="mb-3">
                        <button class="btn btn-warning fw-bold" py-click="burger"> Angelic Burger, 7.99$</button>
                        <button class="btn btn-warning fw-bold" py-click="fries"> Golden Fries, 5.99$</button>
                        <button class="btn btn-warning fw-bold" py-click="shake"> Heavenly Shake, 3.99$</button>
                        <button class="btn btn-warning fw-bold" py-click="icecream"> Atmospheric Flavor, 0.99$</button>
                    </div>

                    <!-- sku generator -->
                    <h3 id="total1" class="mt-4 text-success"></h3>
                    <p id="total2" class="fw-bold"></p>
                    <div class=" text-secondary fw-bold" id="total3"></div>
            </div>


            <py-script src="sku.py"></py-script>
</body>
</html>
