<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: </title>

    <!-- Python Link -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap 5 Link -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <!-- Bootstrap 5 Script -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <div class="container bg-dark p-4 rounded shadow">
            <h1 class="mb-4 text-primary fw-bold">Sky Dine: Receipt Generator</h1>

            <!-- Credentials -->
            <div class="mb-4">
                <label class="form-label fw-bold text-white">Customer Name:</label>
                <input type="text" id="customer" class="form-control text-center">
            </div>

            <!-- Item Select -->
            <div class="border p-3 rounded mb-4 bg-dark">
                <p class="fw-bold text-white mb-2">Please Select an Item!</p>

                <!-- Angelic Burger -->
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="burger" value="7.99">
                    <label class="form-check-label text-white fw-bold">Angelic Burger 7.99$</label>
                </div>

                <!-- Golden Fries -->
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="fries" value="5.99">
                    <label class="form-check-label text-white fw-bold">Golden Fries 5.99$</label>
                </div>

                <!-- Heavenly Shake -->
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="shake" value="3.99">
                    <label class="form-check-label text-white fw-bold">Heavenly Shake 3.99$</label>
                </div>

                <!-- Atmospheric Flavor -->
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="icecream" value="0.99">
                    <label class="form-check-label text-white fw-bold">Atmospheric Flavor 0.99$</label>
                </div>
            </div>
            <!-- Button -->
            <button class="btn btn-danger w-100 fw-bold mb-4" py-click="receipt">Generate Receipt</button>
            <h3 id="process" class="text-warning bg-light text-white p-3 rounded"></h3>
            <p id="output" class="text-success bg-light p-3 rounded"></p>
            <a href="sku.html" class="btn btn-secondary w-100 fw-bold mb-4">Proceed to SKU</a>
        </div>

        <py-script src-="main.py"></py-script>

</body>
</html>
